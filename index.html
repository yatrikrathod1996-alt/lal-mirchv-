<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Al-Mirchi Restaurant POS - Standalone</title>
<style>
:root{--bg:#f6f1f2;--panel:#fff;--ink:#24171b;--muted:#76656a;--line:#e5d9dc;--brand:#741d36;--brandsoft:#f5e8ec;--gold:#c89532;--goldsoft:#fbf2df;--danger:#b42318;--dangsoft:#fde6e3;--blue:#1d63a7;--bluesoft:#dceafa;--dark:#431321;--shadow:0 3px 14px rgba(70,20,35,.07)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.header{height:62px;background:var(--dark);color:#fff;display:flex;align-items:center;gap:11px;padding:7px 14px;position:sticky;top:0;z-index:50}.logo{width:48px;height:48px;border-radius:10px;background:#171113;display:grid;place-items:center;overflow:hidden;flex:0 0 auto}.logo img{width:100%;height:100%;object-fit:contain}.brand h1,.pageHead h2,.dashHero h2,.dashPanel h3{font-family:inherit;letter-spacing:0;font-weight:650}.brand{display:flex;align-items:center;gap:10px}.brand h1{font-size:17px;margin:0}.brand small{color:#b9c2cb}.meta{margin-left:auto;display:flex;align-items:center;gap:7px}.metaBadge{background:#27394b;border:1px solid #3b5267;border-radius:7px;padding:7px 9px;font-size:12px}.metaBadge select{background:transparent;color:#fff;border:0}
.shell{height:calc(100vh - 62px);display:grid;grid-template-columns:190px minmax(0,1fr)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:8px;overflow:auto}.nav{width:100%;border:1px solid transparent;background:#fff;border-radius:7px;padding:9px;text-align:left;font-weight:700;color:#5b6977;margin-bottom:4px}.nav:hover{background:#f2f4f6}.nav.on{background:var(--brandsoft);color:var(--brand);border-color:#cbe8dd}.nav .ico{display:inline-block;width:24px;font-size:17px}
main{min-width:0;overflow:auto;padding:12px}.pageHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.pageHead h2{margin:0;font-size:21px}.pageHead p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px;min-height:40px;font-weight:700}.btn:hover{background:#f5f7f8}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.gold{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.danger{background:var(--dangsoft);color:var(--danger);border-color:#efb8b1}.btn.small{min-height:31px;padding:5px 9px;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-size:23px;font-weight:900;margin-top:4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:end}
.billingOptions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.checkField{display:flex;align-items:center;gap:7px;min-height:40px;font-weight:700;font-size:12px}.checkField input{width:18px;height:18px;accent-color:var(--brand)}
.chartGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.chartCard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px;box-shadow:var(--shadow);min-width:0}.chartCard h3{margin:0 0 4px;font-size:15px}.chartCard .chartHint{color:var(--muted);font-size:11px}.salesBars{height:230px;display:flex;align-items:flex-end;gap:5px;overflow-x:auto;padding:18px 4px 24px;border-bottom:1px solid var(--line)}.salesCol{height:100%;min-width:28px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}.salesBar{width:min(34px,75%);min-height:2px;background:linear-gradient(180deg,#58ac87,var(--brand));border-radius:5px 5px 0 0}.salesVal{font-size:9px;color:var(--muted);white-space:nowrap;margin-bottom:3px}.salesLabel{position:absolute;top:calc(100% + 5px);font-size:9px;color:var(--muted);white-space:nowrap}.hChart{display:grid;gap:11px;margin-top:16px}.hChartRow{display:grid;grid-template-columns:minmax(75px,115px) minmax(0,1fr) 70px;gap:7px;align-items:center;font-size:11px}.hChartName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hChartTrack{height:13px;background:#edf1f3;border-radius:99px;overflow:hidden}.hChartFill{height:100%;background:linear-gradient(90deg,#4c9c79,#0e6b50);border-radius:99px}.hChartFill.exp{background:linear-gradient(90deg,#f0c052,#d88911)}.hChartValue{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}.chartEmpty{font-size:12px;color:var(--muted);padding:28px 5px;text-align:center}
label.f{display:grid;gap:4px;font-size:12px;font-weight:700;color:#5e6b77}input[type=text],input[type=password],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;min-height:40px;border:1px solid var(--line);border-radius:7px;padding:8px 9px;background:#fff;outline:none}textarea{min-height:70px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px 7px;border-bottom:1px solid #e8ebef;text-align:left;vertical-align:middle}th{font-size:10px;text-transform:uppercase;color:#687682;background:#f7f8f9;position:sticky;top:0}.tag{display:inline-block;padding:3px 6px;border-radius:5px;font-size:10px;font-weight:800}.good{background:var(--brandsoft);color:var(--brand)}.warn{background:var(--goldsoft);color:#8c6107}.bad{background:var(--dangsoft);color:var(--danger)}.info{background:var(--bluesoft);color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-weight:700}.tabs button.on{background:var(--dark);color:#fff;border-color:var(--dark)}

/* POS */
.pos{height:calc(100vh - 86px);display:grid;grid-template-columns:170px minmax(0,1fr) 410px;gap:9px}.poscol{min-height:0;display:flex;flex-direction:column;gap:8px}.catlist{overflow:auto}.catbtn{width:100%;background:#fff;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:7px;padding:12px 9px;text-align:left;font-weight:800;margin-bottom:6px}.catbtn.on{background:var(--goldsoft);border-left-color:var(--gold)}
.searchRow{display:flex;gap:7px}.searchRow input{font-size:15px;min-height:44px}.items{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;align-content:start;padding:2px 1px 12px}.item{background:#fff;border:1px solid var(--line);border-radius:9px;padding:12px;min-height:122px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:8px;position:relative;box-shadow:0 1px 2px rgba(40,20,25,.035);transition:border-color .12s,box-shadow .12s}.item:hover{border-color:#a86679;box-shadow:0 3px 10px rgba(70,20,35,.08)}.item.off{opacity:.55}.item .nm{font-weight:620;font-size:14px;line-height:1.3;overflow-wrap:anywhere}.item .sub{font-size:11px;color:var(--muted);margin-top:4px}.item .pr{font-weight:900;font-size:16px}.item .code{display:none}.verify{display:inline-block;background:var(--goldsoft);color:#8c6107;border-radius:4px;padding:3px 5px;font-size:10px;margin-top:5px}.rowFlex{display:flex;justify-content:space-between;align-items:center;gap:7px}
.bill{height:100%;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;overflow:hidden}.billHead{padding:11px;border-bottom:1px solid var(--line)}.billHead h3{margin:0;font-size:16px}.billNo{font-size:11px;color:var(--muted);margin-top:2px}.orderTypes{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.orderTypes .btn{min-height:36px}.billFields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.lines{flex:1;overflow:auto}.billLine{padding:10px;border-bottom:1px solid #e8ebef;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px}.billLine .nm{font-weight:800;overflow-wrap:anywhere}.billLine .amt{font-weight:800;white-space:nowrap}.controls{grid-column:1/-1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.qbtn{width:35px;height:35px;background:#fff;border:1px solid #c5ccd3;border-radius:7px;font-weight:900;font-size:19px;line-height:1}.qty{min-width:22px;text-align:center;font-weight:900;font-size:14px}.link{border:1px solid var(--line);background:#f5f6f7;border-radius:6px;padding:7px 8px;font-size:11px;font-weight:700}.totals{border-top:1px solid var(--line);padding:9px 11px;display:grid;gap:4px}.tot{display:flex;justify-content:space-between;font-size:12px}.grand{font-size:21px;font-weight:900;border-top:1px dashed var(--line);padding-top:7px;margin-top:4px}.billActions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:8px 11px 11px}.billActions .btn{min-height:45px}.wide{grid-column:1/-1}

/* pages */
.tableGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px}.tableCard{background:#fff;border:2px solid var(--line);border-radius:8px;padding:12px;text-align:left;min-height:105px}.tableCard.free{border-color:#77b493}.tableCard.busy{border-color:#d87e76;background:#fff6f5}
.kcols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:calc(100vh - 100px)}.kcol{background:#e7edf1;border-radius:8px;padding:8px;overflow:auto}.kcol h3{font-size:14px;margin:5px}.kot{background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:7px;padding:10px;margin-bottom:8px}.kot.prep{border-left-color:var(--blue)}.kot.ready{border-left-color:var(--brand)}
.attWrap{overflow:auto}.att th,.att td{white-space:nowrap;text-align:center;padding:4px;font-size:10px}.att th:first-child,.att td:first-child{position:sticky;left:0;background:#fff;text-align:left;z-index:3}.attBtn{min-width:29px;height:26px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:10px;font-weight:900}.attSelect{width:43px;height:29px;min-height:29px;padding:2px 3px;text-align:center;font-size:10px;font-weight:900;border:1px solid var(--line);border-radius:5px;cursor:pointer}.attSelect.attendanceChoice{width:min(180px,100%);height:40px;padding:7px;font-size:12px;text-align:left}.attBtn.P,.attSelect.P{background:var(--brandsoft);color:var(--brand)}.attBtn.A,.attSelect.A{background:var(--dangsoft);color:var(--danger)}.attBtn.L,.attSelect.L{background:var(--goldsoft);color:#8c6107}.attBtn.U,.attSelect.U{background:#fff0ef;color:#a23b31}.attBtn.HD,.attSelect.HD{background:#efe8fa;color:#6d3aa2}.attBtn.H,.attSelect.H{background:var(--bluesoft);color:var(--blue)}
.attDailyGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.attEmployee{border:1px solid var(--line);border-radius:9px;padding:12px;background:#fff;display:grid;gap:8px}.attEmployeeHead{display:flex;justify-content:space-between;align-items:start;gap:8px}.attMonthCounts{display:flex;gap:4px;flex-wrap:wrap}.attCount{font-size:10px;border-radius:5px;padding:3px 5px;background:#f5f1f2;color:var(--muted)}.attCount strong{color:var(--ink)}.attStatusBar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.attSelectedDate{font-weight:800;color:var(--brand);font-size:14px}
.modalBg{position:fixed;inset:0;background:rgba(12,20,27,.55);display:none;align-items:center;justify-content:center;z-index:90}.modalBg.show{display:flex}.modal{background:#fff;border-radius:8px;width:min(720px,94vw);max-height:90vh;overflow:auto;padding:15px}.modal h3{margin:0 0 11px}.modalGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.modalFoot{display:flex;justify-content:flex-end;gap:7px;margin-top:13px}.toast{position:fixed;right:18px;bottom:18px;background:var(--dark);color:#fff;border-radius:7px;padding:10px 13px;display:none;z-index:100;font-size:12px}
@media(max-width:1250px){.pos{grid-template-columns:155px minmax(0,1fr) 380px}}@media(max-width:1000px){.shell{grid-template-columns:70px minmax(0,1fr)}.nav .txt{display:none}.nav{text-align:center}.pos{grid-template-columns:1fr;height:auto}.bill{min-height:520px}.kcols{grid-template-columns:1fr;height:auto}.grid2,.modalGrid{grid-template-columns:1fr}}@media(max-width:650px){.pageHead{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:repeat(2,1fr)}}
.dashboard{min-height:calc(100vh - 90px);display:flex;flex-direction:column;gap:12px}.dashHero{background:linear-gradient(115deg,#431321,#7b213b 68%,#973a50);color:#fff;border-radius:12px;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px;box-shadow:0 7px 20px rgba(70,20,35,.14);overflow:hidden}.dashMascot{width:88px;height:88px;object-fit:contain;flex:0 0 auto;filter:drop-shadow(0 4px 6px #240a12)}.dashHero h2{font-size:24px;margin:0}.dashHero p{margin:5px 0 0;color:#f0dfe4}.dashActions{display:flex;gap:8px;flex-wrap:wrap}.dashActions .btn{border-color:#ffffff66;background:#ffffff15;color:#fff}.dashActions .btn.primary{background:#fff;color:#64172f;border-color:#fff}.dashKpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.dashKpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}.dashKpi:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}.dashKpi .k{font-size:11px;color:var(--muted)}.dashKpi .v{font-size:24px;font-weight:900;margin-top:6px}.dashKpi .hint{font-size:10px;color:var(--muted);margin-top:4px}.dashMain{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.85fr);gap:12px;flex:1}.dashPanel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px;box-shadow:var(--shadow);min-width:0}.dashPanel h3{margin:0;font-size:15px}.dashPanel .muted{font-size:11px}.dashBars{display:flex;align-items:flex-end;gap:10px;height:210px;padding:15px 8px 26px;border-bottom:1px solid var(--line);overflow-x:auto}.dashDay{height:100%;flex:1;min-width:32px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}.dashBar{width:min(42px,72%);background:linear-gradient(180deg,#a94860,#741d36);border-radius:6px 6px 2px 2px;min-height:2px}.dashBarLabel{position:absolute;top:calc(100% + 5px);font-size:10px;color:var(--muted);white-space:nowrap}.dashBarValue{font-size:9px;color:var(--muted);white-space:nowrap;margin-bottom:3px}.dashShortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.dashShortcut{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:left;font-weight:700}.dashShortcut:hover{background:var(--brandsoft);border-color:#d7b9c2}.dashShortcut b{font-size:17px}.dashRecent{width:100%;border-collapse:collapse}.dashRecent td{padding:8px 5px}.dashStock{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.dashVerify{padding:11px;background:var(--goldsoft);border-radius:8px;margin-top:11px;font-size:12px}.dashEmpty{display:grid;place-items:center;min-height:170px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:1100px){.dashKpis{grid-template-columns:repeat(3,minmax(0,1fr))}.dashMain{grid-template-columns:1fr}}@media(max-width:650px){.dashHero{align-items:flex-start;flex-direction:row;flex-wrap:wrap;padding:14px}.dashMascot{width:58px;height:58px}.dashActions{width:100%}.dashKpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dashKpi .v{font-size:20px}.dashBars{height:175px}}
</style>
</head>

    <div class="orderTypes"><button class="btn ${orderType==='Dine-In'?'primary':''}" onclick="orderType='Dine-In';billing()">🪑 Dine-In</button><button class="btn ${orderType==='Takeaway'?'primary':''}" onclick="orderType='Takeaway';billing()">🥡 Takeaway</button><button class="btn ${orderType==='Delivery'?'primary':''}" onclick="orderType='Delivery';billing()">🛵 Delivery</button></div>

    <div class="billingOptions"><label class="checkField"><input id="gstEnabled" type="checkbox" ${gstEnabled?'checked':''} onchange="gstEnabled=this.checked;drawCart()"> Include GST</label><label class="f">Discount %<input id="discountPercent" type="number" min="0" max="100" step="0.1" value="${discountPercent}" oninput="discountPercent=this.value;drawCart()"></label></div>
    ${orderType==='Dine-In'?`<div style="margin-top:7px"><select id="tableSelect" aria-label="Select table">${Array.from({length:20},(_,i)=>{const n=i+1,busy=orders.some(o=>o.id!==currentOrderId&&o.type==='Dine-In'&&o.table===n&&!['paid','cancelled'].includes(o.status));return `<option value="${n}" ${selectedTable===n?'selected':''}>Table ${n} — ${busy?'Occupied':'Free'}</option>`}).join('')}</select></div>`:''}

function drawItems(){
  const q=posSearch.trim().toLowerCase();
  const a=menu.filter(x=>(!q||`${x.name} ${x.code} ${x.category} ${x.subcategory||''}`.toLowerCase().includes(q))&&(q||(x.category===posCat&&(posSub==='All'||x.subcategory===posSub))));
 $('#itemArea').innerHTML=a.map(x=>{
  const can=x.available&&x.price!==null&&!x.needsVerification;
  return `<button class="item ${can?'':'off'}" onclick="${can?`addToCart('${x.code}')`:`toast('Verify price in Menu before billing')`}"><div><div class="nm">${esc(x.name)}</div><div class="sub">${esc(x.subcategory||x.category)}</div>${x.needsVerification?'<span class="verify">Needs price verification</span>':''}</div><div class="rowFlex"><span class="pr">${x.price===null?'₹ --':money(x.price)}</span><span class="btn small ${can?'primary':''}">${can?'+ Add':'Verify'}</span></div></button>`;
 }).join('')||'<div class="card">No items found.</div>';
}
function addToCart(code){const x=menu.find(i=>i.code===code);if(!x||!x.available||x.price===null||x.needsVerification)return;const e=cart.find(i=>i.code===code);if(e)e.qty++;else cart.push({code,name:x.name,price:Number(x.price),gst:Number(x.gst??settings.defaultGst)||0,taxInclusive:x.taxInclusive!==false,qty:1,note:''});drawCart()}
function changeQty(i,d){cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);drawCart()}
function clearCart(){cart=[];drawCart()}
function addNote(i){const n=prompt('Item note',cart[i].note||'');if(n!==null){cart[i].note=n;drawCart()}}
function totals(){const sub=cart.reduce((a,x)=>a+x.price*x.qty,0),pct=Math.max(0,Math.min(100,Number(discountPercent)||0)),discount=sub*pct/100;let tax=0,total=0;for(const x of cart){const rate=Number(x.gst??menu.find(m=>m.code===x.code)?.gst??settings.defaultGst)||0,amount=x.price*x.qty*(1-pct/100),inclusive=x.taxInclusive??menu.find(m=>m.code===x.code)?.taxInclusive??settings.taxInclusive;if(!gstEnabled){total+=amount}else if(inclusive){tax+=amount*rate/(100+rate);total+=amount}else{tax+=amount*rate/100;total+=amount*(1+rate/100)}}return{sub,discount,tax,total:Math.round(total),discountPercent:pct}}
function drawCart(){
 const el=$('#billLines');if(!el)return;
 el.innerHTML=cart.length?cart.map((x,i)=>`<div class="billLine"><div><div class="nm">${esc(x.name)}</div><div class="muted">${money(x.price)} each</div></div><div class="amt">${money(x.price*x.qty)}</div><div class="controls"><button class="qbtn" onclick="changeQty(${i},-1)">−</button><span class="qty">${x.qty}</span><button class="qbtn" onclick="changeQty(${i},1)">+</button><button class="link" onclick="addNote(${i})">Note</button><button class="link" onclick="cart.splice(${i},1);drawCart()">Remove</button></div></div>`).join(''):'<div class="empty"><b>No items</b><br><span class="muted">Tap + Add on a menu item.</span></div>';
 const t=totals();$('#subTotal').textContent=money(t.sub);$('#discountTotal').textContent=money(t.discount);$('#discountLabel').textContent=`${t.discountPercent}%`;$('#taxTotal').textContent=money(t.tax);$('#grandTotal').textContent=money(t.total);$('#payAmount').textContent=money(t.total);
}
function orderDetails(){const t=totals();return {type:orderType,table:orderType==='Dine-In'?selectedTable:null,customer:customerName.trim(),mobile:customerMobile.trim(),address:deliveryAddress.trim(),subtotal:t.sub,discountPercent:t.discountPercent,discountAmount:t.discount,tax:t.tax,gstApplied:gstEnabled,total:t.total,items:cart.map(x=>({...x})),date:today()}}
function captureCustomer(o){if(!o.customer&&!o.mobile)return;let c=customers.find(x=>(o.mobile&&x.mobile===o.mobile)||(!o.mobile&&x.name.toLowerCase()===o.customer.toLowerCase()));if(c){if(o.customer)c.name=o.customer;if(o.mobile)c.mobile=o.mobile;if(o.address)c.address=o.address}else{c={id:Date.now(),name:o.customer||'Customer',mobile:o.mobile||'',address:o.address||''};customers.push(c)}save('am_customers_full',customers)}
function saveOrder(status,kotStatus=null){const data=orderDetails();captureCustomer(data);const o={id:Date.now(),no:settings.invoicePrefix+String(settings.invoiceNext).padStart(5,'0'),...data,status,payment:null,kotStatus};settings.invoiceNext++;orders.push(o);save('am_orders_full',orders);save('am_settings_full',settings);return o}
function sendKOT(){if(!cart.length)return toast('Add items before sending KOT');if(currentOrderId){const o=orders.find(x=>x.id===currentOrderId),data=orderDetails();captureCustomer(data);Object.assign(o,data,{status:o.status==='paid'?'paid':'pending',kotStatus:'pending'});save('am_orders_full',orders)}else currentOrderId=saveOrder('pending','pending').id;cart=[];billing();toast('KOT sent to kitchen')}
function holdBill(){if(!cart.length)return toast('Nothing to hold');if(currentOrderId){const o=orders.find(x=>x.id===currentOrderId),data=orderDetails();captureCustomer(data);Object.assign(o,data,{status:'held'});save('am_orders_full',orders)}else currentOrderId=saveOrder('held',null).id;cart=[];billing();toast('Bill held')}
function payBill(){if(!cart.length)return toast('Add items before payment');openPayment()}
function openPayment(){const t=totals();modal('Complete Payment',`<div class="stat"><div class="k">Amount Payable</div><div class="v">${money(t.total)}</div></div><div class="card" style="margin-top:10px"><div class="muted" style="font-size:11px;margin-bottom:7px">Select payment method</div><div class="toolbar"><button class="btn primary" id="payCash">Cash</button><button class="btn" id="payOnline">Online</button></div></div>`,[['Cancel','',closeModal]]);$('#payCash').onclick=()=>completePayment('Cash',t.total);$('#payOnline').onclick=()=>completePayment('Online',t.total)}
function completePayment(method,total){let o;const paidAt=new Date().toISOString();if(currentOrderId){o=orders.find(x=>x.id===currentOrderId);const data=orderDetails();captureCustomer(data);Object.assign(o,data,{status:'paid',payment:method,total:Math.round(total),paidAt});save('am_orders_full',orders)}else{o=saveOrder('paid','pending');o.payment=method;o.total=Math.round(total);o.paidAt=paidAt;save('am_orders_full',orders)}currentOrderId=null;cart=[];discountPercent=0;closeModal();billing();toast('Payment received • Bill completed')}

function menuPage(){
 $('#main').innerHTML=`<div class="pageHead"><div><h2>Menu Management</h2><p>${menu.length} exact seeded menu items. Prices are empty in the source project until admin verification.</p></div><div class="toolbar"><button class="btn primary" onclick="addMenu()">+ Add Item</button><button class="btn" onclick="exportMenu()">Export CSV</button></div></div><div class="stats"><div class="stat"><div class="k">Total Items</div><div class="v">${menu.length}</div></div><div class="stat"><div class="k">Needs Verification</div><div class="v">${menu.filter(x=>x.needsVerification).length}</div></div><div class="stat"><div class="k">Billable</div><div class="v">${menu.filter(x=>x.price!==null&&x.available&&!x.needsVerification).length}</div></div></div><div class="card"><div class="toolbar"><label class="f" style="min-width:250px">Search<input id="mq" placeholder="Search menu..." oninput="drawMenuTable()"></label><label class="f">Category<select id="mcat" onchange="drawMenuTable()"><option value="">All</option>${[...new Set(menu.map(x=>x.category))].map(c=>`<option>${c}</option>`).join('')}</select></label></div><div style="overflow:auto;max-height:68vh;margin-top:9px"><table><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>Subcategory</th><th>Price ₹</th><th>GST %</th><th>Status</th><th>Actions</th></tr></thead><tbody id="menuBody"></tbody></table></div></div>`;drawMenuTable();
}
function drawMenuTable(){const q=($('#mq')?.value||'').toLowerCase(),c=$('#mcat')?.value||'';const a=menu.filter(x=>(!q||`${x.name} ${x.code}`.toLowerCase().includes(q))&&(!c||x.category===c));$('#menuBody').innerHTML=a.map(x=>`<tr><td>${esc(x.code)}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${esc(x.subcategory||'-')}</td><td><input type="number" min="0" style="max-width:90px" value="${x.price??''}" placeholder="Verify" onchange="setPrice('${esc(x.code)}',this.value)"></td><td><input type="number" min="0" style="max-width:65px" value="${x.gst}" onchange="setGST('${esc(x.code)}',this.value)"></td><td>${x.needsVerification?'<span class="tag warn">Needs Verification</span>':'<span class="tag good">Verified</span>'}</td><td><button class="btn small" onclick="toggleMenu('${esc(x.code)}')">${x.available?'Disable':'Enable'}</button> <button class="btn small danger" onclick="deleteMenu('${esc(x.code)}')">Delete</button></td></tr>`).join('')}
function setPrice(code,v){const x=menu.find(i=>i.code===code);if(!x)return;const n=v===''?null:Number(v);if(n!==null&&(!Number.isFinite(n)||n<0))return toast('Enter a valid non-negative price');x.price=n;x.needsVerification=n===null;save('am_menu_full',menu);drawMenuTable();toast(n===null?'Price marked for verification':'Menu price verified')}
function setGST(code,v){const x=menu.find(i=>i.code===code),n=Number(v);if(!x||!Number.isFinite(n)||n<0||n>100)return toast('GST must be between 0 and 100');x.gst=n;save('am_menu_full',menu);toast('GST updated')}
function toggleMenu(code){const x=menu.find(i=>i.code===code);x.available=!x.available;save('am_menu_full',menu);drawMenuTable()}
function deleteMenu(code){if(!confirm('Delete this item?'))return;menu=menu.filter(x=>x.code!==code);save('am_menu_full',menu);drawMenuTable();toast('Menu item deleted')}
function addMenu(){modal('Add Menu Item',`<div class="modalGrid"><label class="f">Item Code<input id="mmc"></label><label class="f">Item Name<input id="mmn"></label><label class="f">Category<select id="mmcat"><option>Dosa</option><option>Bhel</option><option>Rice</option><option>Pulav</option><option>Soup</option><option>Papad</option><option>Other</option></select></label><label class="f">Subcategory<input id="mms"></label><label class="f">Price ₹<input id="mmp" type="number" min="0"></label><label class="f">GST %<input id="mmg" type="number" min="0" max="100" value="${settings.defaultGst}"></label></div>`,[['Cancel','',closeModal],['Add Item','primary',()=>{const code=$('#mmc').value.trim(),name=$('#mmn').value.trim(),priceRaw=$('#mmp').value,gst=Number($('#mmg').value),price=priceRaw===''?null:Number(priceRaw);if(!/^[A-Za-z0-9_-]+$/.test(code)||!name)return toast('Use a simple item code and enter an item name');if(menu.some(x=>x.code.toLowerCase()===code.toLowerCase()))return toast('Item code already exists');if(price!==null&&(!Number.isFinite(price)||price<0))return toast('Enter a valid non-negative price');if(!Number.isFinite(gst)||gst<0||gst>100)return toast('GST must be between 0 and 100');const x={code,name,category:$('#mmcat').value,subcategory:$('#mms').value.trim(),price,gst,taxInclusive:true,available:true,needsVerification:price===null};menu.push(x);save('am_menu_full',menu);closeModal();menuPage();toast('Menu item added')}]] )}

function exportMenu(){const csv=['Item Code,Item Name,Category,Subcategory,Price,GST,Available'].concat(menu.map(x=>[x.code,x.name,x.category,x.subcategory,x.price??'',x.gst,x.available].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='al-mirchi-menu.csv';a.click();URL.revokeObjectURL(u)}

function customersPage(){ $('#main').innerHTML=`<div class="pageHead"><div><h2>Customers</h2><p>Saved customer records and paid order history</p></div><button class="btn primary" onclick="addCustomer()">+ Add Customer</button></div><div class="card" style="overflow:auto"><table><thead><tr><th>Customer</th><th>Mobile</th><th>Orders</th><th>Total Spend</th><th>Last Order</th></tr></thead><tbody>${customers.map(c=>{const co=orders.filter(o=>o.status==='paid'&&((c.mobile&&o.mobile===c.mobile)||(!c.mobile&&o.customer===c.name)));return `<tr><td><b>${esc(c.name)}</b><br>${esc(c.address||'')}</td><td>${esc(c.mobile||'—')}</td><td>${co.length}</td><td>${money(co.reduce((a,o)=>a+Number(o.total||0),0))}</td><td>${esc(co.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]?.date||'-')}</td></tr>`}).join('')||'<tr><td colspan="5">No customers saved.</td></tr>'}</tbody></table></div>`}
function addCustomer(){modal('Add Customer',`<div class="modalGrid"><label class="f">Name<input id="cn"></label><label class="f">Mobile<input id="cm" inputmode="tel"></label><label class="f" style="grid-column:1/-1">Address<textarea id="ca"></textarea></label></div>`,[['Cancel','',closeModal],['Save','primary',()=>{const name=$('#cn').value.trim(),mobile=$('#cm').value.trim();if(!name)return toast('Customer name is required');if(mobile&&customers.some(c=>c.mobile===mobile))return toast('A customer with this mobile already exists');customers.push({id:Date.now(),name,mobile,address:$('#ca').value.trim()});save('am_customers_full',customers);closeModal();customersPage();toast('Customer saved')}]] )}

function inventoryPage(){ $('#main').innerHTML=`<div class="pageHead"><div><h2>Inventory</h2><p>Basic stock controls</p></div><button class="btn primary" onclick="addInventory()">+ Add Item</button></div><div class="stats"><div class="stat"><div class="k">Stock Items</div><div class="v">${inventory.length}</div></div><div class="stat"><div class="k">Low Stock</div><div class="v">${inventory.filter(x=>x.stock<x.min).length}</div></div></div><div class="card" style="overflow:auto"><table><thead><tr><th>Item</th><th>Unit</th><th>Current</th><th>Minimum</th><th>Purchase ₹</th><th>Status</th><th>Adjust</th></tr></thead><tbody>${inventory.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.unit}</td><td>${x.stock}</td><td>${x.min}</td><td>${money(x.price)}</td><td>${x.stock<x.min?'<span class="tag bad">Low Stock</span>':'<span class="tag good">OK</span>'}</td><td><button class="btn small" onclick="adjustInventory(${x.id})">Adjust</button></td></tr>`).join('')}</tbody></table></div>`}
function addInventory(){modal('Add Inventory Item',`<div class="modalGrid"><label class="f">Name<input id="in"></label><label class="f">Unit<input id="iu" value="kg"></label><label class="f">Opening Stock<input id="io" type="number" value="0"></label><label class="f">Minimum Stock<input id="im" type="number" value="0"></label><label class="f">Purchase ₹<input id="ip" type="number" value="0"></label></div>`,[['Cancel','',closeModal],['Add','primary',()=>{inventory.push({id:Date.now(),name:$('#in').value,unit:$('#iu').value,stock:Number($('#io').value)||0,min:Number($('#im').value)||0,price:Number($('#ip').value)||0});save('am_inventory_full',inventory);closeModal();inventoryPage();toast('Inventory item added')}]] )}
function adjustInventory(id){const x=inventory.find(i=>i.id===id);modal('Adjust Stock',`<label class="f">Change quantity (+ receive / - use)<input id="iq" type="number" step="any"></label><label class="f" style="margin-top:8px">Reason<textarea id="ir">Manual adjustment</textarea></label>`,[['Cancel','',closeModal],['Save','primary',()=>{const n=Number($('#iq').value);if(!Number.isFinite(n)||!$('#iq').value)return toast('Enter a valid quantity');if(x.stock+n<0)return toast('Stock cannot be negative');x.stock+=n;save('am_inventory_full',inventory);closeModal();inventoryPage();toast('Stock updated')}]] )}

function expensesPage(){const total=expenses.reduce((a,e)=>a+Number(e.amount),0);$('#main').innerHTML=`<div class="pageHead"><div><h2>Expenses</h2><p>Record restaurant expenses</p></div><button class="btn primary" onclick="addExpense()">+ Add Expense</button></div><div class="stats"><div class="stat"><div class="k">Entries</div><div class="v">${expenses.length}</div></div><div class="stat"><div class="k">Total</div><div class="v">${money(total)}</div></div></div><div class="card" style="overflow:auto"><table><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Payment</th><th>Description</th><th></th></tr></thead><tbody>${expenses.slice().reverse().map(e=>`<tr><td>${e.date}</td><td>${esc(e.category)}</td><td>${money(e.amount)}</td><td>${e.payment}</td><td>${esc(e.description)}</td><td><button class="btn small danger" onclick="deleteExpense(${e.id})">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No expenses.</td></tr>'}</tbody></table></div>`}
function addExpense(){modal('Add Expense',`<div class="modalGrid"><label class="f">Date<input id="ed" type="date" value="${today()}"></label><label class="f">Category<select id="ec" onchange="document.getElementById('ecustomWrap').classList.toggle('hidden',this.value!=='__custom')"><option>Milk</option><option>Flour</option><option>Spices</option><option>Vegetables</option><option>Raw Material</option><option>Salary</option><option>Rent</option><option>Electricity</option><option>Gas</option><option>Maintenance</option><option>Other</option><option value="__custom">Other / custom…</option></select></label><label id="ecustomWrap" class="f hidden">Custom category<input id="ecustom" placeholder="Enter a category, e.g. Repairs"></label><label class="f">Amount ₹<input id="ea" type="number" min="0" step="0.01"></label><label class="f">Payment<select id="ep"><option>Cash</option><option>Online</option></select></label><label class="f" style="grid-column:1/-1">Description<textarea id="ex"></textarea></label></div>`,[['Cancel','',closeModal],['Save','primary',()=>{const amount=Number($('#ea').value),custom=$('#ec').value==='__custom',category=custom?$('#ecustom').value.trim():$('#ec').value;if(!$('#ed').value||!Number.isFinite(amount)||amount<=0)return toast('Enter a date and amount greater than zero');if(custom&&!category)return toast('Enter a custom category');expenses.push({id:Date.now(),date:$('#ed').value,category,amount,payment:$('#ep').value,description:$('#ex').value.trim()});save('am_expenses_full',expenses);closeModal();expensesPage();toast('Expense saved')}]] )}
function deleteExpense(id){expenses=expenses.filter(x=>x.id!==id);save('am_expenses_full',expenses);expensesPage()}

function employeesPage(){const act=employees.filter(e=>e.active);$('#main').innerHTML=`<div class="pageHead"><div><h2>Employees</h2><p>Employee master • add, edit, salary and deactivate</p></div><button class="btn primary" onclick="addEmployee()">+ Add Employee</button></div><div class="stats"><div class="stat"><div class="k">Active Employees</div><div class="v">${act.length}</div></div><div class="stat"><div class="k">Monthly Payroll</div><div class="v">${money(act.reduce((a,e)=>a+Number(e.salary||0),0))}</div></div></div><div class="card" style="overflow:auto"><table><thead><tr><th>Code</th><th>Name</th><th>Designation</th><th>Department</th><th>Joining</th><th>Salary ₹</th><th>Status</th><th>Actions</th></tr></thead><tbody>${employees.map(e=>`<tr><td>${esc(e.code)}</td><td><b>${esc(e.name)}</b><br><span class="muted">${esc(e.mobile||'-')}</span></td><td>${esc(e.designation)}</td><td>${esc(e.department)}</td><td>${esc(e.joiningDate)}</td><td>${money(e.salary)}</td><td>${e.active?'<span class="tag good">Active</span>':'<span class="tag bad">Inactive</span>'}</td><td><button class="btn small" onclick="editEmployee(${e.id})">Edit</button> <button class="btn small" onclick="editEmpSalary(${e.id})">Salary</button> <button class="btn small danger" onclick="toggleEmployee(${e.id})">${e.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div>`}
function addEmployee(){modal('Add Employee',`<div class="modalGrid"><label class="f">Employee Code<input id="ecode" value="EMP${String(employees.length+1).padStart(3,'0')}"></label><label class="f">Name<input id="ename"></label><label class="f">Mobile<input id="emob"></label><label class="f">Designation<input id="edesig" value="Staff"></label><label class="f">Department<select id="edept"><option>Kitchen</option><option>Service</option><option>Billing</option><option>Admin</option><option>Delivery</option></select></label><label class="f">Joining Date<input id="ejoin" type="date" value="${today()}"></label><label class="f">Monthly Salary ₹<input id="esal" type="number"></label></div>`,[['Cancel','',closeModal],['Add Employee','primary',()=>{const e={id:Date.now(),code:$('#ecode').value,name:$('#ename').value,mobile:$('#emob').value,designation:$('#edesig').value,department:$('#edept').value,joiningDate:$('#ejoin').value,salary:Number($('#esal').value)||0,active:true};if(!e.name)return toast('Employee name is required');employees.push(e);save('am_employees_full',employees);closeModal();employeesPage();toast('Employee added')}]] )}
function editEmployee(id){const e=employees.find(x=>x.id===id);modal('Edit Employee',`<div class="modalGrid"><label class="f">Name<input id="een" value="${esc(e.name)}"></label><label class="f">Mobile<input id="eem" value="${esc(e.mobile||'')}"></label><label class="f">Designation<input id="eedes" value="${esc(e.designation)}"></label><label class="f">Department<input id="eedep" value="${esc(e.department)}"></label><label class="f">Joining Date<input id="eej" type="date" value="${e.joiningDate}"></label></div>`,[['Cancel','',closeModal],['Save','primary',()=>{Object.assign(e,{name:$('#een').value,mobile:$('#eem').value,designation:$('#eedes').value,department:$('#eedep').value,joiningDate:$('#eej').value});save('am_employees_full',employees);closeModal();employeesPage();toast('Employee updated')}]] )}
function editEmpSalary(id){const e=employees.find(x=>x.id===id),v=prompt('Monthly salary for '+e.name,e.salary);if(v!==null&&Number(v)>=0){e.salary=Number(v);save('am_employees_full',employees);employeesPage();toast('Salary updated')}}
function toggleEmployee(id){const e=employees.find(x=>x.id===id);e.active=!e.active;save('am_employees_full',employees);employeesPage()}

function getAtt(id,date){return date>today()?'F':attendance[id+'_'+date]||'P'}
function setAtt(id,date,s){const wrap=$('.attWrap'),left=wrap?.scrollLeft||0,top=wrap?.scrollTop||0;attendance[id+'_'+date]=s;save('am_attendance_full',attendance);attendancePage();const next=$('.attWrap');if(next){next.scrollLeft=left;next.scrollTop=top}}
function cycleAtt(id,date){const s=getAtt(id,date),n={P:'A',A:'L',L:'U',U:'HD',HD:'H',H:'P',F:'P'}[s];setAtt(id,date,n)}
function markMonth(s){const [y,m]=attMonth.split('-').map(Number),days=new Date(y,m,0).getDate();employees.filter(e=>e.active).forEach(e=>{for(let d=1;d<=days;d++){const dt=`${attMonth}-${String(d).padStart(2,'0')}`;if(dt<=today())attendance[`${e.id}_${dt}`]=s}});save('am_attendance_full',attendance);attendancePage()}
function attendancePage(){
 const [y,m]=attMonth.split('-').map(Number),days=new Date(y,m,0).getDate();
 $('#main').innerHTML=`<div class="pageHead"><div><h2>Attendance</h2><p>Daily/monthly attendance. Source project logic: missing days count as Present.</p></div><div class="toolbar"><label class="f">Month<input type="month" value="${attMonth}" onchange="attMonth=this.value;attendancePage()"></label><button class="btn primary" onclick="markMonth('P')">Mark All Present</button></div></div>
 <div class="card"><div class="attWrap"><table class="att"><thead><tr><th>Employee</th>${Array.from({length:days},(_,i)=>`<th>${i+1}</th>`).join('')}<th>P</th><th>A</th><th>L</th><th>U</th><th>HD</th><th>H</th></tr></thead><tbody>${employees.filter(e=>e.active).map(e=>{let c={P:0,A:0,L:0,U:0,HD:0,H:0},cells='';for(let d=1;d<=days;d++){const dt=`${attMonth}-${String(d).padStart(2,'0')}`,st=getAtt(e.id,dt);c[st]++;cells+=`<td>${st==='F'?'<span class="attBtn F" title="Future date">F</span>':`<select class="attSelect ${st}" aria-label="${esc(e.name)} ${dt} attendance" title="${esc(e.name)} · ${dt}" onchange="setAtt(${e.id},'${dt}',this.value)">${[['P','Present'],['A','Absent'],['L','Paid Leave'],['U','Unpaid Leave'],['HD','Half Day'],['H','Holiday']].map(([v,label])=>`<option value="${v}" ${st===v?'selected':''} title="${label}">${v}</option>`).join('')}</select>`}</td>`}return `<tr><td><b>${esc(e.name)}</b><br><span class="muted">${esc(e.designation)}</span></td>${cells}<td>${c.P}</td><td>${c.A}</td><td>${c.L}</td><td>${c.U}</td><td>${c.HD}</td><td>${c.H}</td></tr>`}).join('')}</tbody></table></div><div class="muted" style="margin-top:7px;font-size:10px">Choose a status directly: P Present • A Absent • L Paid Leave • U Unpaid Leave • HD Half Day • H Holiday</div></div>`;
}

function calcSalary(e,month,days){let c={P:0,A:0,L:0,U:0,HD:0,H:0};for(let d=1;d<=days;d++){const dt=`${month}-${String(d).padStart(2,'0')}`;if(dt<=today())c[getAtt(e.id,dt)]++}const daily=Number(e.salary||0)/days;const deduction=(c.A+c.U+c.HD*.5)*daily;const adj=load('am_payadj_'+e.id+'_'+month,{bonus:0,advance:0,other:0});const net=Math.max(0,Number(e.salary||0)-deduction+Number(adj.bonus||0)-Number(adj.advance||0)-Number(adj.other||0));return {e,...c,deduction,net,adj}}
function salaryPage(){
 const [y,m]=payMonth.split('-').map(Number),days=new Date(y,m,0).getDate(),rows=employees.filter(e=>e.active).map(e=>calcSalary(e,payMonth,days));
 $('#main').innerHTML=`<div class="pageHead"><div><h2>Salary & Payroll</h2><p>Monthly calculation from attendance + bonus/advance/deduction</p></div><div class="toolbar"><label class="f">Month<input type="month" value="${payMonth}" onchange="payMonth=this.value;salaryPage()"></label><button class="btn" onclick="exportPayroll()">Export CSV</button></div></div>
 <div class="stats"><div class="stat"><div class="k">Employees</div><div class="v">${rows.length}</div></div><div class="stat"><div class="k">Gross Salary</div><div class="v">${money(rows.reduce((a,r)=>a+r.e.salary,0))}</div></div><div class="stat"><div class="k">Attendance Deductions</div><div class="v">${money(rows.reduce((a,r)=>a+r.deduction,0))}</div></div><div class="stat"><div class="k">Net Payroll</div><div class="v">${money(rows.reduce((a,r)=>a+r.net,0))}</div></div></div>
 <div class="card" style="overflow:auto"><table><thead><tr><th>Employee</th><th>Gross ₹</th><th>P</th><th>Paid L</th><th>U</th><th>A</th><th>HD</th><th>Paid Days</th><th>Deduction ₹</th><th>Net ₹</th><th>Adjust</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.e.name)}</b><br><span class="muted">${esc(r.e.designation)}</span></td><td>${money(r.e.salary)}</td><td>${r.P}</td><td>${r.L}</td><td>${r.U}</td><td>${r.A}</td><td>${r.HD}</td><td>${r.P+r.L+r.H+r.HD*.5}</td><td>${money(r.deduction)}</td><td><b>${money(r.net)}</b></td><td><button class="btn small" onclick="payAdjustForm(${r.e.id})">Bonus / Advance</button></td></tr>`).join('')}</tbody></table></div>
 <div class="card"><b>Calculation rules</b><div class="muted" style="font-size:11px;margin-top:4px">Paid Leave and Holiday are paid. Absent and Unpaid Leave deduct one daily salary. Half Day deducts 0.5 daily salary. Bonus is added; Advance and Other Deduction are subtracted.</div></div>`;
}
function payAdjustForm(id){const e=employees.find(x=>x.id===id),old=load('am_payadj_'+id+'_'+payMonth,{bonus:0,advance:0,other:0});modal('Payroll Adjustments - '+e.name,`<div class="modalGrid"><label class="f">Bonus ₹<input id="pb" type="number" value="${old.bonus}"></label><label class="f">Advance ₹<input id="pa" type="number" value="${old.advance}"></label><label class="f">Other Deduction ₹<input id="po" type="number" value="${old.other}"></label></div>`,[['Cancel','',closeModal],['Save','primary',()=>{save('am_payadj_'+id+'_'+payMonth,{bonus:Number($('#pb').value)||0,advance:Number($('#pa').value)||0,other:Number($('#po').value)||0});closeModal();salaryPage();toast('Payroll adjustment saved')}]] )}
function exportPayroll(){const [y,m]=payMonth.split('-').map(Number),days=new Date(y,m,0).getDate(),rows=employees.filter(e=>e.active).map(e=>calcSalary(e,payMonth,days));const csv=['Employee,Designation,Gross,Present,Paid Leave,Unpaid,Absent,Half Day,Deduction,Net'].concat(rows.map(r=>[r.e.name,r.e.designation,r.e.salary,r.P,r.L,r.U,r.A,r.HD,Math.round(r.deduction),Math.round(r.net)].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download=`payroll-${payMonth}.csv`;a.click();URL.revokeObjectURL(u)}

Shortcut" onclick="go('Inventory')"><b>📦</b> Inventory</button><button class="dashShortcut" onclick="go('Expenses')"><b>💸</b> Expenses</button><button class="dashShortcut" onclick="go('Salary & Payroll')"><b>💰</b> Payroll</button></div></div><div class="dashPanel"><h3>Recently billed</h3>${recent.length?`<table class="dashRecent"><tbody>${recent.map(o=>`<tr><td><b>${esc(o.no)}</b><div class="muted">${esc(o.date)} · ${esc(o.type)}</div></td><td><span class="tag ${o.status==='paid'?'good':o.status==='held'?'warn':'info'}">${esc(o.status)}</span></td><td style="text-align:right;font-weight:800">${money(o.total)}</td></tr>`).join('')}</tbody></table>`:'<div class="dashEmpty" style="min-height:90px">No bills yet. Start your first bill.</div>'}</div></div><aside style="display:grid;gap:12px;align-content:start"><div class="dashPanel"><h3>Best sellers</h3><div class="muted">Most ordered items · all time</div>${top.length?top.map((i,n)=>`<div class="dashStock"><span><b style="color:var(--brand)">#${n+1}</b> &nbsp;${esc(i.name)}</span><b>${i.qty}</b></div>`).join(''):'<div class="dashEmpty" style="min-height:100px">Item sales will show after paid orders.</div>'}</div><div class="dashPanel"><h3>Stock to check</h3><div class="muted">Inventory below minimum level</div>${low.length?low.slice(0,6).map(x=>`<div class="dashStock"><span>${esc(x.name)}</span><b style="color:var(--danger)">${x.stock} ${esc(x.unit||'')}</b></div>`).join(''):'<div class="dashEmpty" style="min-height:75px">All recorded stock is above minimum.</div>'}<button class="btn small" style="margin-top:10px" onclick="go('Inventory')">Open inventory</button></div><div class="dashPanel"><h3>Menu readiness</h3><div class="muted">All ${menu.length} menu items are loaded from your printed menu.</div><div class="dashVerify"><b>${menu.filter(x=>x.available!==false).length}</b> items currently available to sell.<br><span class="muted">You can search by name or filter by category.</span></div><button class="btn small" styl const dashboardWithoutPayroll=dashboard;
dashboard=function(){dashboardWithoutPayroll();const main=$('#main');main.innerHTML=main.innerHTML.replace(/<div class="dashKpi"><div class="k">MONTHLY PAYROLL<\/div>[\s\S]*?<\/div><\/div>/,'');for(const [label,page] of [['OPEN BILLS / KOT','Orders'],['TEAM PRESENT','Attendance'],['LOW STOCK','Inventory']]){const old=`<div class="dashKpi"><div class="k">${label}</div>`,clickable=`<div class="dashKpi" role="button" tabindex="0" style="cursor:pointer" onclick="go('${page}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();go('${page}')}" aria-label="Open ${page}"><div class="k">${label}</div>`;main.innerHTML=main.innerHTML.replace(old,clickable)}}
// Older saved records using UPI or Card are counted in Online for consistent two-option reporting.
const drawReportsCashOnlineBase=drawReports;
drawReports=function(){drawReportsCashOnlineBase();const host=$('#reportContent');if(!host)return;const range=reportRange(reportPeriod,reportAnchor),paid=orders.filter(o=>o.status==='paid'&&o.date>=range.start&&o.date<=range.end),cash=paid.filter(o=>o.payment==='Cash').reduce((s,o)=>s+Number(o.total||0),0),online=paid.filter(o=>o.payment!=='Cash').reduce((s,o)=>s+Number(o.total||0),0);host.innerHTML=host.innerHTML.replace(/<div class="card"><h3>Payment Summary<\/h3><table>[\s\S]*?<\/table><\/div>/,`<div class="card"><h3>Payment Summary</h3><table><tr><td>Cash</td><td>${money(cash)}</td></tr><tr><td>Online</td><td>${money(online)}</td></tr></table></div>`)}
function reportBucket(from,to){const days=Math.max(0,(new Date(`${to}T00:00:00`)-new Date(`${from}T00:00:00`))/86400000);return days>=300?'yearly':days>=150?'sixMonths':days>=70?'quarterly':days>=45?'monthly':'daily'}
function setReportDates(){const from=$('#reportFrom').value,to=$('#reportTo').value,error=$('#reportDateError');if(!from||!to){if(error)error.textContent='Choose both a From and To date.';return}if(from>to){if(error)error.textContent='To date must be on or after From date.';return}reportFrom=from;reportTo=to;reportAnchor=from;reportPeriod=reportBucket(from,to);$('#reportPeriod').value=reportPeriod;$('#reportAnchor').value=from;if(error)error.textContent='';drawReports()}
function setQuickReportRange(kind){const now=new Date(),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let from,to=today();if(kind==='lastMonth'){const first=new Date(now.getFullYear(),now.getMonth()-1,1),last=new Date(now.getFullYear(),now.getMonth(),0);from=iso(first);to=iso(last)}else{const months=kind==='sixMonths'?6:kind==='threeMonths'?3:1;from=iso(new Date(now.getFullYear(),now.getMonth()-months+1,1))}$('#reportFrom').value=from;$('#reportTo').value=to;setReportDates()}
function rangePayrollRows(range){const months=[];for(let d=new Date(Number(range.start.slice(0,4)),Number(range.start.slice(5,7))-1,1);d<=new Date(Number(range.end.slice(0,4)),Number(range.end.slice(5,7))-1,1);d.setMonth(d.getMonth()+1)){const m=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,payDate=payDateFor(m);if(payDate>=range.start&&payDate<=range.end)months.push(m)}return months.flatMap(month=>{const [y,m]=month.split('-').map(Number),days=new Date(y,m,0).getDate();return employees.map(e=>({employee:e,month,payDate:payDateFor(month),salary:calcSalary(e,month,days),status:payrollRecord(e.id,month)}))})}
function rangeInventorySpend(range){return inventory.flatMap(item=>stockHistory(item.id).filter(h=>h.type==='Received'&&h.date>=range.start&&h.date<=range.end).map(h=>({item,entry:h}))).sort((a,b)=>a.entry.date.localeCompare(b.entry.date))}
function buildReportRows(){const range=reportRange(reportPeriod,reportAnchor),rows=[['Section','Date / Period','Name / Category','Details','Quantity','Amount (INR)','Payment / Status']],paid=orders.filter(o=>o.status==='paid'&&o.date>=range.start&&o.date<=range.end),itemTotals={};paid.forEach(o=>{rows.push(['Order',o.date,o.no,`${o.type}${o.customer?' • '+o.customer:''}`, '',Number(o.total||0),o.payment||'']);(o.items||[]).forEach(i=>{const key=i.code||i.name,r=itemTotals[key]||(itemTotals[key]={name:i.name,code:i.code||'',qty:0,amount:0});const qty=Number(i.qty||0),amt=Number(i.price||0)*qty*(1-(Number(o.discountPercent)||0)/100);r.qty+=qty;r.amount+=amt})});Object.values(itemTotals).forEach(i=>rows.push(['Item Sales',`${range.start} to ${range.end}`,i.name,i.code,i.qty,i.amount,'']));const exps=expenses.filter(e=>e.date>=range.start&&e.date<=range.end),expCats={};exps.forEach(e=>{expCats[e.category]=(expCats[e.category]||0)+Number(e.amount||0);rows.push(['Expense',e.date,e.category,e.description||'', '',Number(e.amount||0),e.payment||''])});Object.entries(expCats).forEach(([cat,amount])=>rows.push(['Expense Total',`${range.start} to ${range.end}`,cat,'Category total','',amount,'']));rangeInventorySpend(range).forEach(({item,entry})=>rows.push(['Inventory Purchase',entry.date,item.name,entry.reason||entry.type,entry.qty,Number(entry.amount||0),'']));rangePayrollRows(range).forEach(({employee,month,payDate,salary,status})=>{rows.push(['Payroll',month,employee.name,`Pay date ${payDate}; P ${salary.P}, A ${salary.A}, L ${salary.L}, U ${salary.U}, HD ${salary.HD}`, '',salary.net,status.status||'Unpaid']);rows.push(['Payroll Detail',month,employee.name,'Gross salary','',Number(employee.salary||0),'']);rows.push(['Payroll Detail',month,employee.name,'Attendance deduction','',Number(salary.deduction||0),'']);rows.push(['Payroll Detail',month,employee.name,'Bonus','',Number(salary.adj.bonus||0),'']);rows.push(['Payroll Detail',month,employee.name,'Advance deducted','',Number(salary.adj.advance||0),'']);rows.push(['Payroll Detail',month,employee.name,'Other deduction','',Number(salary.adj.other||0),'']);readAdvances(employee.id,month).forEach(a=>rows.push(['Salary Advance',a.date||month,employee.name,a.note||'Advance','',Number(a.amount||0),'Deducted']));});return rows}
function exportPeriodReport(){if(!reportFrom||!reportTo||reportFrom>reportTo)return toast('Choose a valid From and To date first');const csv=buildReportRows().map(row=>row.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n'),blob=new Blob(['\ufeff',csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`restaurant-report-${reportFrom}-to-${reportTo}.csv`;a.click();URL.revokeObjectURL(url);toast('Complete date-range report downloaded')}
function reportsPage(){if(!reportFrom)reportFrom=`${today().slice(0,7)}-01`;if(!reportTo)reportTo=today();reportAnchor=reportFrom;reportPeriod=reportBucket(reportFrom,reportTo);$('#main').innerHTML=`<div class="pageHead"><div><h2>Reports</h2><p>Choose any date range to review sales, items, expenses, inventory spend and payroll</p></div><button class="btn primary" onclick="exportPeriodReport()">Download Complete Report CSV</button></div><div class="card"><div class="toolbar"><label class="f">From<input id="reportFrom" type="date" value="${reportFrom}" onchange="setReportDates()"></label><label class="f">To<input id="reportTo" type="date" value="${reportTo}" onchange="setReportDates()"></label><div id="reportDateError" class="muted" role="status"></div></div><div class="toolbar" style="margin-top:9px"><span class="muted" style="font-size:11px">Quick range:</span><button class="btn small" onclick="setQuickReportRange('thisMonth')">This month</button><button class="btn small" onclick="setQuickReportRange('lastMonth')">Last month</button><button class="btn small" onclick="setQuickReportRange('threeMonths')">Last 3 months</button><button class="btn small" onclick="setQuickReportRange('sixMonths')">Last 6 months</button></div><select id="reportPeriod" style="display:none"><option value="daily">Daily</option><option value="monthly">Monthly</option><option value="quarterly">Quarterly</option><option value="sixMonths">6 months</option><option value="yearly">1 year</option></select><input id="reportAnchor" type="hidden" value="${reportFrom}"></div><div id="reportContent"></div>`;$('#reportPeriod').value=reportPeriod;drawReports()}
const drawReportsWithDateRangeDetails=drawReports;
drawReports=function(){drawReportsWithDateRangeDetails();const host=$('#reportContent');if(!host)return;const range=reportRange(reportPeriod,reportAnchor),inv=rangeInventorySpend(range),byItem={};inv.forEach(({item,entry})=>{const row=byItem[item.id]||(byItem[item.id]={name:item.name,unit:item.unit||'',qty:0,refills:0,amount:0});row.qty+=Number(entry.qty||0);row.refills++;row.amount+=Number(entry.amount||0)});const payroll=rangePayrollRows(range);host.innerHTML+=`<div class="grid2" style="margin-top:10px"><div class="card" style="overflow:auto"><h3>Inventory purchase spend by item</h3><table><thead><tr><th>Item</th><th>Refills</th><th>Qty received</th><th>Total spend</th></tr></thead><tbody>${Object.values(byItem).sort((a,b)=>b.amount-a.amount).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.refills}</td><td>${x.qty} ${esc(x.unit)}</td><td>${money(x.amount)}</td></tr>`).join('')||'<tr><td colspan="4">No inventory purchases in this date range.</td></tr>'}</tbody></table><p class="muted" style="font-size:10px">Based on inventory refill entries saved in Inventory History.</p></div><div class="card" style="overflow:auto"><h3>Employee payroll in this date range</h3><table><thead><tr><th>Employee / Month</th><th>Pay date</th><th>P/A/L/U/HD</th><th>Gross</th><th>Advance</th><th>Net</th><th>Status</th></tr></thead><tbody>${payroll.map(r=>`<tr><td>${esc(r.employee.name)}<br><span class="muted">${esc(r.month)}</span></td><td>${esc(r.payDate)}</td><td>${r.salary.P}/${r.salary.A}/${r.salary.L}/${r.salary.U}/${r.salary.HD}</td><td>${money(r.employee.salary)}</td><td>${money(r.salary.adj.advance||0)}</td><td>${money(r.salary.net)}</td><td>${esc(r.status.status||'Unpaid')}</td></tr>`).join('')||'<tr><td colspan="7">No payroll pay dates in this date range.</td></tr>'}</tbody></table></div></div>`}
function reportRange(period,from,to){const start=to?from:(reportFrom||from||today()),end=to||reportTo||start;return {start,end,label:`${start} to ${end}`}}
function setAttendanceMonth(month){attMonth=month;const last=monthEnd(month),end=last<today()?last:today(),first=`${month}-01`;if(attDate.slice(0,7)!==month||attDate>end||attDate<first)attDate=end>=first?end:first;attendancePage()}
function setAttendanceDay(date){if(!date||date.slice(0,7)!==attMonth||date>today())return;attDate=date;attendancePage()}
function markSelectedDay(status){if(attDate>today())return toast('Future dates cannot be marked');employees.filter(e=>e.active).forEach(e=>attendance[`${e.id}_${attDate}`]=status);save('am_attendance_full',attendance);attendancePage();toast(`Everyone marked ${status==='P'?'Present':status} for ${attDate}`)}
function attendancePage(){const monthEndDate=monthEnd(attMonth),maxDate=monthEndDate<today()?monthEndDate:today(),active=employees.filter(e=>e.active),totals={P:0,A:0,L:0,U:0,HD:0,H:0},statusNames={P:'Present',A:'Absent',L:'Paid Leave',U:'Unpaid Leave',HD:'Half Day',H:'Holiday'},statusOptions=Object.entries(statusNames),[y,m]=attMonth.split('-').map(Number),days=new Date(y,m,0).getDate();if(attDate.slice(0,7)!==attMonth||attDate>maxDate)attDate=maxDate>=`${attMonth}-01`?maxDate:`${attMonth}-01`;const rows=active.map(e=>{const todayStatus=getAtt(e.id,attDate);if(totals[todayStatus]!==undefined)totals[todayStatus]++;const count={P:0,A:0,L:0,U:0,HD:0,H:0};for(let d=1;d<=days;d++){const date=`${attMonth}-${String(d).padStart(2,'0')}`;if(date<=today()){const s=getAtt(e.id,date);if(count[s]!==undefined)count[s]++}}return `<article class="attEmployee"><div class="attEmployeeHead"><div><b>${esc(e.name)}</b><div class="muted">${esc(e.designation||'Employee')}</div></div><span class="tag ${todayStatus==='P'?'good':todayStatus==='A'||todayStatus==='U'?'bad':todayStatus==='L'||todayStatus==='HD'?'warn':'info'}">${statusNames[todayStatus]||todayStatus}</span></div><label class="f">Status for ${esc(attDate)}<select class="attSelect attendanceChoice ${todayStatus}" aria-label="${esc(e.name)} attendance for ${esc(attDate)}" onchange="setAtt(${e.id},'${attDate}',this.value)" ${todayStatus==='F'?'disabled':''}>${statusOptions.map(([code,label])=>`<option value="${code}" ${todayStatus===code?'selected':''}>${label}</option>`).join('')}</select></label><div class="muted" style="font-size:10px">This month</div><div class="attMonthCounts">${statusOptions.map(([code,label])=>`<span class="attCount" title="${label}">${code} <strong>${count[code]}</strong></span>`).join('')}</div></article>`}).join('');$('#main').innerHTML=`<div class="pageHead"><div><h2>Attendance</h2><p>Pick a date, then choose each employee’s status directly. Unmarked past days count as Present.</p></div><div class="toolbar"><label class="f">Month<input type="month" value="${attMonth}" max="${today().slice(0,7)}" onchange="setAttendanceMonth(this.value)"></label><label class="f">Attendance date<input id="attDatePicker" type="date" min="${attMonth}-01" max="${maxDate}" value="${attDate}" onchange="setAttendanceDay(this.value)"></label><button class="btn primary" onclick="markSelectedDay('P')">Mark This Day Present</button></div></div><div class="stats"><div class="stat"><div class="k">Present</div><div class="v">${totals.P}</div></div><div class="stat"><div class="k">Absent</div><div class="v">${totals.A}</div></div><div class="stat"><div class="k">Leave / Half Day</div><div class="v">${totals.L+totals.U+totals.HD}</div></div><div class="stat"><div class="k">Holiday</div><div class="v">${totals.H}</div></div></div><div class="attDailyGrid">${rows||'<div class="card">No active employees. Add an employee to record attendance.</div>'}</div><div class="card muted" style="font-size:11px;margin-top:10px">Status key: P Present · A Absent · L Paid Leave · U Unpaid Leave · HD Half Day · H Holiday. Monthly counts update payroll calculations.</div>`}
function clearDemoData(){if(!load('am_demo_seed_v1',false))return toast('No demo data is loaded');const demoIds=employees.filter(e=>e.isDemo).map(e=>e.id);orders=orders.filter(x=>!x.isDemo);expenses=expenses.filter(x=>!x.isDemo);customers=customers.filter(x=>!x.isDemo);inventory.filter(x=>x.isDemo).forEach(x=>delete inventoryHistory[x.id]);inventory=inventory.filter(x=>!x.isDemo);employees=employees.filter(x=>!x.isDemo);Object.keys(attendance).forEach(k=>{if(demoIds.some(id=>k.startsWith(id+'_')))delete attendance[k]});try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(demoIds.some(id=>k.includes(String(id))))localStorage.removeItem(k)}localStorage.removeItem('am_demo_seed_v1')}catch{}save('am_orders_full',orders);save('am_expenses_full',expenses);save('am_customers_full',customers);save('am_inventory_full',inventory);saveStockHistory();save('am_employees_full',employees);save('am_attendance_full',attendance);settingsPage();toast('Demo data removed')}
function modal(title,body,buttons=[]){const m=$('#modal'),i=$('#modalInner');m.classList.add('show');i.innerHTML=`<h3>${esc(title)}</h3>${body}<div class="modalFoot">${buttons.map((b,n)=>`<button class="btn ${b[1]}" id="mb${n}">${b[0]}</button>`).join('')}</div>`;buttons.forEach((b,n)=>{const el=$('#mb'+n);if(el)el.onclick=b[2]})}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('mousedown',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(view==='Billing'&&!$('#modal').classList.contains('show')){if(e.key==='F1'){e.preventDefault();billing()}if(e.key==='F2'){e.preventDefault();$('#psearch')?.focus()}if(e.key==='F3'){e.preventDefault();payBill()}if(e.key==='F5'){e.preventDefault();holdBill()}}});
updateRestaurantBrand();renderNav();render();
</script>
